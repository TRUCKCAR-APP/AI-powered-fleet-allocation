server:
  port: 8085

spring:
  application:
    name: ms-ai-fleet-allocation

  datasource:
    # Fuera de Docker (IDE/tests) la conexión es directa y el esquema va en currentSchema. En Docker se pasa por
    # PgBouncer y el search_path lo fija el rol del servicio.
    url: jdbc:postgresql://localhost:5432/truckcar_db?currentSchema=fleet_allocation,public
    username: truckcar_admin
    password: truckcar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincida con las entidades.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    # Esquema propio del servicio (rol y esquema creados por db-init); el historial de Flyway vive en él.
    schemas: fleet_allocation
    default-schema: fleet_allocation
    # Bases anteriores a Flyway (tablas creadas por Hibernate): línea base 0 para que V1 (idempotente) se aplique.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fleet-allocation-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckcar:
  kafka:
    topic:
      load-events: truckcar.events.load-allocation
      vehicle-status: truckcar.events.vehicle-status

  # Timeouts HTTP hacia fleets-drivers y Load-Allocation (RestClientConfig).
  http:
    connect-timeout: 2s
    read-timeout: 4s

# Llamadas a los servicios vecinos (NeighborServiceCalls). Un 4xx no es una falla de disponibilidad: no abre el
# circuito ni se reintenta. Con el circuito abierto se aplica el fallback noCandidatesAvailable sin esperar.
resilience4j:
  circuitbreaker:
    configs:
      neighbor:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      fleetsDrivers:
        base-config: neighbor
      loadAllocation:
        base-config: neighbor
  retry:
    configs:
      neighbor:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      fleetsDrivers:
        base-config: neighbor
      loadAllocation:
        base-config: neighbor

services:
  load-allocation:
    url: http://localhost:8083
  fleets-drivers:
    url: http://localhost:8081

# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# /actuator/prometheus solo es accesible dentro de la red interna: el api-gateway no enruta /actuator/**.
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        # Duración del matching (@Observed en FleetAllocationService): percentiles en el dashboard.
        truckcar.allocation.matching: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      # X-Correlation-Id (lo genera el api-gateway) viaja como cabecera propia en HTTP y en Kafka y se copia al MDC.
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id

logging:
  # [servicio,traceId,spanId] en cada línea de log y, en las peticiones que lo traen, el X-Correlation-Id.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [cid=%X{X-Correlation-Id:-}] "
